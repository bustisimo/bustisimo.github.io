<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Justis DiBattista</title>
  <script>
    // Apply saved/system theme before first paint (prevents light-mode flash)
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">JD</a>
    <ul id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-right">
      <button id="theme-toggle" aria-label="Toggle dark mode"></button>
      <button id="menu-toggle" aria-label="Toggle navigation">&#9776;</button>
    </div>
  </nav>

  <section id="contact" class="contact">
    <h2 class="reveal">Get in Touch</h2>
    <p class="reveal">Interested in collaborating or just want to say hi? Reach out through any of these.</p>
    <div class="contact-links reveal">
      <a href="https://linkedin.com/in/justisdibattista" target="_blank">
        <span class="link-icon">&#128101;</span> LinkedIn
      </a>
      <a href="https://github.com/bustisimo" target="_blank">
        <span class="link-icon">&#128187;</span> GitHub
      </a>
    </div>
  </section>

  <footer>
    <div class="footer-links">
      <a href="https://github.com/bustisimo" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/justisdibattista" target="_blank">LinkedIn</a>
    </div>
    <p>&copy; 2026 Justis DiBattista</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
